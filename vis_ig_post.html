<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS FOR THE ARTS | Instagram Post</title>
    <!-- Google Fonts: Premium Typography Pairing -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@200;300;400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F9F6F0; /* Soft warm cream background matching screenshot */
            --card-bg: #FFFFFF;
            --text-main: #2F2F2F;
            --text-muted: #8E8D8A;
            --pola-gold: #C5A880; /* Elegant gold accent */
            --font-serif: 'Cormorant Garamond', 'Noto Serif TC', serif;
            --font-sans: 'Outfit', 'Noto Sans TC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: var(--font-sans);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        /* 4:5 Instagram Post Canvas */
        #ig-canvas {
            width: 1200px;
            height: 1500px;
            background-color: var(--bg-color);
            position: relative;
            padding: 100px 200px; /* Generous margins to center content */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        /* Top Logo Row */
        .logo-row {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 30px;
        }

        .logo-img {
            height: 120px; /* Big elegant logo in the top right */
            filter: brightness(0) saturate(100%) invert(72%) sepia(23%) saturate(543%) hue-rotate(344deg) brightness(88%) contrast(84%); /* Gold color filter matching #C5A880 */
            opacity: 0.95;
        }

        /* Title Area */
        .title-row {
            width: 100%;
            text-align: center;
            margin-bottom: 70px;
        }

        .post-title {
            font-family: 'Noto Serif TC', serif;
            font-size: 46px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.2em;
            line-height: 1.3;
            text-indent: 0.2em; /* Balance centering with letter-spacing */
        }

        /* --- Stats Block --- */
        .stats-container {
            width: 800px; /* Exact width to fit the grid and balance layout */
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .stats-grid-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(197, 168, 128, 0.08);
            border-radius: 4px;
            height: 260px; /* Horizontal rectangular cards */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(165, 155, 140, 0.09); /* Warmer shadow */
        }

        .stat-card.full-width {
            grid-column: span 2;
            height: 190px;
        }

        .stat-number {
            font-family: 'Cormorant Garamond', serif;
            font-size: 80px;
            font-weight: 300;
            color: var(--pola-gold);
            line-height: 1;
            margin-bottom: 12px;
            font-style: italic;
            letter-spacing: -0.01em;
        }

        .stat-label {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div id="ig-canvas">
        <!-- Logo Row -->
        <div class="logo-row">
            <img src="https://img1.wsimg.com/isteam/ip/e6b4acac-1653-4d0e-9e55-ed5572206955/VIS%20LOGO_%E5%B7%A5%E4%BD%9C%E5%8D%80%E5%9F%9F%201%20(1).png" class="logo-img" alt="VIS Logo">
        </div>

        <!-- Title Row -->
        <div class="title-row">
            <h2 class="post-title">精準客群 ‧ <span style="display: inline-block;">關係延續</span></h2>
        </div>

        <!-- Stats Container -->
        <div class="stats-container">
            <div class="stats-grid-row">
                <div class="stat-card">
                    <span class="stat-number">71%</span>
                    <span class="stat-label">共超過品味貴賓</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">21%</span>
                    <span class="stat-label">收藏人士</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">34%</span>
                    <span class="stat-label">企業主</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number">13%</span>
                    <span class="stat-label">媒體/意見領袖</span>
                </div>
            </div>
            <div class="stat-card full-width">
                <span class="stat-number">67%</span>
                <span class="stat-label">一年購買預算80萬以上</span>
            </div>
        </div>
    </div>

</body>
</html>
