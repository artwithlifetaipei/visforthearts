<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>VIS 2027 Exhibition Floor Plan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: "PingFang TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      position: relative;
      width: 1024px;
      height: 766px;
      background-image: url('floor_plan_2027_bg.png');
      background-size: 1024px 766px;
      background-repeat: no-repeat;
      overflow: hidden;
    }
    
    /* Typography Styles */
    .label {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      white-space: nowrap;
      color: #0D0D0D;
      user-select: none;
    }
    
    /* Room Names: Bold, clean, medium size */
    .room-label {
      font-size: 11.5px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }
    
    /* Regular Booth Labels (L2, L3, L4, L6, L7): Consistent bold/medium size */
    .booth-label {
      font-size: 11.5px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }
    
    /* Corner/Large Booth Labels: Consistent bold, slightly larger size */
    .large-booth-label {
      font-size: 13.5px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    
    /* Internal Hall Booth Labels (A02, A03, A05雙展台, etc.) */
    .hall-label {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.2px;
    }
    
    /* Center Area Banner Labels */
    .center-year {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 2px;
    }
    .center-title {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.8px;
      display: block;
    }
    .center-sub {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: #333333;
      display: block;
    }
    
    /* Tiny Labels */
    .tiny-label {
      font-size: 9px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Room Labels -->
    <div class="label room-label" style="left: 122.5px; top: 189.5px;">後方器材室</div>
    <div class="label room-label" style="left: 237.5px; top: 217px;">廠方器材室</div>
    <div class="label room-label" style="left: 771.5px; top: 217px;">廠方器材室</div>
    <div class="label room-label" style="left: 882.5px; top: 199px;">休息室 2</div>
    <div class="label room-label" style="left: 120.5px; top: 308px;">休息室 3</div>
    <div class="label room-label" style="left: 884px; top: 308px;">展商休息區</div>
    
    <!-- 廠方器材 / 儲藏室 (Multiline) -->
    <div class="label room-label" style="left: 121.5px; top: 425.5px; line-height: 1.4;">
      廠方器材 /<br>儲藏室
    </div>

    <!-- 2. Tiny Label -->
    <div class="label tiny-label" style="left: 805px; top: 174px;">整電盤</div>

    <!-- 3. Central Banner Labels (Split to prevent any border overlap) -->
    <div class="label" style="left: 496px; top: 390px; line-height: 1.25;">
      <span class="center-year">2027</span>
      <span class="center-title">中央策展區</span>
    </div>
    <div class="label" style="left: 496px; top: 434px;">
      <span class="center-sub">Live Perspective Talk</span>
    </div>

    <!-- 4. Inner Hall Booth Labels -->
    <div class="label hall-label" style="left: 225.5px; top: 329px;">A03</div>
    <div class="label hall-label" style="left: 363.5px; top: 329px;">A02</div>
    <div class="label hall-label" style="left: 544.5px; top: 329px;">A02</div>
    <div class="label hall-label" style="left: 685.5px; top: 329px;">A03</div>
    
    <div class="label hall-label" style="left: 243px; top: 482.5px;">A05雙展台</div>
    <div class="label hall-label" style="left: 358.5px; top: 466px;">A01主入口隔壁</div>
    <div class="label hall-label" style="left: 685.5px; top: 466px;">A01主入口隔壁</div>
    <div class="label hall-label" style="left: 732.5px; top: 540px;">A05雙展台</div>
    
    <div class="label hall-label" style="left: 358px; top: 573px;">A04最近主入口</div>
    <div class="label hall-label" style="left: 625px; top: 562px;">A04最近主入口</div>
    <div class="label room-label" style="left: 501.5px; top: 629px;">主入口</div>

    <!-- 5. Regular Wall & Bottom Booths -->
    <div class="label booth-label" style="left: 118.5px; top: 532px;">展位 L2</div>
    <div class="label booth-label" style="left: 872.5px; top: 424px;">展位 L7</div>
    <div class="label booth-label" style="left: 878px; top: 532px;">展位 L6</div>
    
    <div class="label booth-label" style="left: 363.5px; top: 642.5px;">展位 L3</div>
    <div class="label booth-label" style="left: 625px; top: 642.5px;">展位 L4</div>

    <!-- 6. Corner Large Booths -->
    <div class="label large-booth-label" style="left: 166.5px; top: 640px;">最大獨立展位L1</div>
    <div class="label large-booth-label" style="left: 828.5px; top: 640px;">最大獨立展位L5</div>
  </div>

</body>
</html>
