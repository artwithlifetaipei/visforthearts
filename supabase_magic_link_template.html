<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIS Contemporary Culture Fair</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        table {
            border-spacing: 0;
            width: 100%;
        }
        td {
            padding: 0;
        }
        img {
            border: 0;
        }
        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #000000;
            padding-bottom: 80px;
            padding-top: 80px;
        }
        .main-table {
            background-color: #0A0A0A;
            margin: 0 auto;
            width: 100%;
            max-width: 460px;
            border: 1px solid #1A1A1A;
            font-family: inherit;
        }
        .content-cell {
            padding: 56px 40px;
            text-align: center;
        }
        .logo-img {
            height: 32px;
            width: auto;
            margin-bottom: 44px;
        }
        .title {
            color: #DFBA87;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.35em;
            margin-top: 0;
            margin-bottom: 24px;
            line-height: 1.5;
            text-align: center;
        }
        .divider {
            width: 40px;
            height: 1px;
            background-color: #DFBA87;
            margin: 0 auto 32px auto;
            opacity: 0.25;
        }
        .message {
            color: #CCCCCC;
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 0.18em;
            line-height: 2.2;
            margin: 0 0 44px 0;
            text-align: center;
        }
        .button-container {
            margin-bottom: 56px;
        }
        .btn {
            background-color: #DFBA87;
            color: #000000 !important;
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.45em;
            padding: 16px 48px;
            text-decoration: none;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.0;
            border-radius: 0px;
            transition: background-color 0.3s ease;
        }
        .footer-divider {
            width: 100%;
            height: 1px;
            background-color: #1A1A1A;
            margin-bottom: 28px;
        }
        .footer {
            color: #666666;
            font-size: 9.5px;
            letter-spacing: 0.18em;
            line-height: 2.0;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <center class="wrapper">
        <table class="main-table">
            <tr>
                <td class="content-cell">
                    <!-- LOGO -->
                    <a href="https://www.visforthearts.com" target="_blank" style="text-decoration: none; display: inline-block;">
                        <img class="logo-img" src="https://www.visforthearts.com/vis_logo.png" alt="VIS Logo" />
                    </a>
                    
                    <!-- TITLE -->
                    <h1 class="title">您的貴賓通行證已備妥。</h1>
                    
                    <!-- DIVIDER -->
                    <div class="divider"></div>
                    
                    <!-- MESSAGE -->
                    <p class="message">
                        感謝您蒞臨 VIS Contemporary Culture Fair。<br/>
                        輕觸下方按鈕即可開啟。
                    </p>
                    
                    <!-- BUTTON -->
                    <div class="button-container">
                        <a class="btn" href="{{ .ConfirmationURL }}">log in</a>
                    </div>
                    
                    <!-- FOOTER -->
                    <div class="footer-divider"></div>
                    <p class="footer">
                        © 2026/2027 VIS Contemporary Culture Fair VIS 當代文化博覽會
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
